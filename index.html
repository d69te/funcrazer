<meta property="og:title" content="FUNCRAZER | فنكرايزر — المنيو">
<meta property="og:description" content="بطاطا أمستردام — بغداد، شارع المتنبي">
<meta property="og:url" content="https://d69te.github.io/funcrazer/">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Oswald:wght@600&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0b09; --surface:#171510; --surface-2:#211d17; --surface-3:#2c271e; --line:rgba(240,220,170,.16);
  --gold:#d4b06a; --gold-hi:#f0dcaa; --cream:#f5eedf; --muted:#b3aa98;
  --f-display:"Lalezar","Readex Pro",sans-serif; --f-body:"Readex Pro",system-ui,sans-serif;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:64px;
  --r:20px; --spring:cubic-bezier(.34,1.56,.64,1); --smooth:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;overflow-x:clip}
body{background:var(--bg);color:var(--cream);font-family:var(--f-body);font-size:16px;line-height:1.7;overflow-x:clip;-webkit-font-smoothing:antialiased}
html[lang="en"] body{line-height:1.6}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px;border-radius:12px}
.price{font-variant-numeric:tabular-nums;unicode-bidi:isolate;white-space:nowrap}
.cur{font-size:.66em;color:var(--gold);margin-inline-start:3px;font-weight:400}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:30;background:rgba(12,11,9,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.bar-in{max-width:1040px;margin-inline:auto;display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s4)}
.bar img{width:44px;height:44px;border-radius:50%}
.bar .nm{flex:1;font-family:var(--f-display);font-size:20px;color:var(--gold-hi);line-height:1}
.lang{font-size:13px;color:var(--gold-hi);border:1px solid var(--line);border-radius:999px;padding:var(--s1) var(--s3);min-height:34px;transition:background .3s}
.lang:hover{background:var(--surface)}
.tabs{position:relative;list-style:none;display:flex;gap:var(--s1);overflow-x:auto;scrollbar-width:none;max-width:1040px;margin-inline:auto;padding:0 var(--s4) var(--s2)}
.tabs::-webkit-scrollbar{display:none}
.tabs a{position:relative;z-index:1;display:block;white-space:nowrap;text-decoration:none;font-size:14px;color:var(--muted);padding:var(--s1) var(--s4);border-radius:999px;line-height:28px;transition:color .35s var(--smooth)}
.tabs a.on{color:var(--bg);font-weight:600}
.pill{position:absolute;z-index:0;left:0;top:0;height:36px;border-radius:999px;background:var(--gold);transition:transform .45s var(--smooth),width .45s var(--smooth);pointer-events:none}

/* ---------- hero ---------- */
.intro{text-align:center;padding:var(--s6) var(--s4) var(--s4)}
.stagewrap{position:relative;width:220px;height:220px;margin:0 auto;display:grid;place-items:center}
.disc{position:absolute;inset:0;border-radius:50%;background:var(--surface)}
.ring{position:absolute;inset:-10px;border-radius:50%;border:1.5px dashed rgba(212,176,106,.45);animation:spin 50s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cone{position:relative;width:150px;margin-top:-18px}
.cone svg{width:100%;height:auto;overflow:visible;display:block}
.cone .fry{transform-box:fill-box;transform-origin:50% 100%;animation:rise .9s var(--spring) both;animation-delay:calc(var(--i) * 70ms + .15s)}
.cone.jump .fry{animation:hop .6s var(--spring);animation-delay:calc(var(--i) * 40ms)}
@keyframes rise{from{transform:translateY(70px) scaleY(.6);opacity:0}}
@keyframes hop{40%{transform:translateY(-18px)}}
.ribbon{--c:18px;display:inline-block;margin-top:calc(var(--s5) * -1);position:relative;padding:2px;background:var(--gold-hi);
  clip-path:polygon(var(--c) 0,calc(100% - var(--c)) 0,100% 50%,calc(100% - var(--c)) 100%,var(--c) 100%,0 50%)}
.ribbon h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,8vw,40px);line-height:1.35;color:var(--bg);
  background:linear-gradient(180deg,#f3dfae,#d4b06a);padding:var(--s1) var(--s7);
  clip-path:polygon(calc(var(--c) - 1px) 0,calc(100% - var(--c) + 1px) 0,100% 50%,calc(100% - var(--c) + 1px) 100%,calc(var(--c) - 1px) 100%,0 50%)}
.where{display:inline-flex;align-items:center;gap:var(--s1);color:var(--muted);font-size:14px;margin-top:var(--s3)}
.where svg{width:16px;height:16px;color:var(--gold)}

main{max-width:1040px;margin-inline:auto;padding:0 var(--s4)}
section{padding-top:var(--s7);scroll-margin-top:100px}
.head{margin-bottom:var(--s4)}
.head h2{font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1.4;color:var(--gold-hi)}
.head p{font-size:13px;color:var(--muted)}

/* ---------- item rows ---------- */
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s2)}
.row{width:100%;display:flex;align-items:center;gap:var(--s3);padding:var(--s2);padding-inline-end:var(--s4);border-radius:var(--r);background:var(--surface);transition:transform .35s var(--smooth),background .35s}
.row:hover{background:var(--surface-2)}
.so{flex:none;font-size:12px;font-weight:600;line-height:22px;color:#f3d9d0;background:rgba(160,40,30,.55);border:1px solid rgba(240,140,120,.35);border-radius:999px;padding:0 var(--s2);white-space:nowrap;text-shadow:none}
.row.off{cursor:default;background:var(--surface)}
.row.off:active{transform:none}
.row.off .thumb,.row.off .info{opacity:.42;filter:grayscale(1)}
.card.off{cursor:default}
.card.off .art,.card.off .nm,.card.off .pr{opacity:.38;filter:grayscale(1)}
.card.off:hover .art{transform:none}
.card-in{position:relative}
.card .so{position:absolute;z-index:2;top:var(--s2);left:50%;transform:translateX(-50%);font-size:11px;line-height:20px}
.can.off{cursor:default;animation:none;opacity:.35;filter:grayscale(1)}
.labels small{display:block;font-size:11px;color:var(--gold-hi)}
.labels .so{display:inline-block;font-style:normal;font-size:10px;line-height:18px;padding:0 6px;margin-top:2px}
.so.big{display:inline-block;margin-top:var(--s4);font-size:18px;line-height:1.8;padding:var(--s1) var(--s5)}
.row:active{transform:scale(.98)}
.thumb{flex:none;width:76px;height:76px;border-radius:14px;overflow:hidden;background:var(--surface-2)}
.thumb.ph{width:100px;height:75px;background:#0b0a09}
.thumb svg,.thumb img{width:100%;height:100%;display:block;object-fit:cover}
.info{flex:1;min-width:0}
.info b{display:block;font-weight:600;font-size:17px;line-height:1.45}
.tagline{display:flex;flex-wrap:wrap;gap:var(--s1);margin-top:2px}
.tg{font-size:11px;color:var(--gold);background:rgba(212,176,106,.1);border-radius:999px;padding:0 var(--s2);line-height:20px}
.pr{flex:none}
.pr .price,.szl .price{font-weight:600;font-size:16px;color:var(--gold-hi)}
.szl{display:flex;flex-wrap:wrap;gap:0 var(--s3);margin-top:2px}
.szl span{display:flex;align-items:baseline;gap:6px}
.szl small{font-size:12px;color:var(--muted)}
.more{flex:none;display:flex;align-items:center;gap:2px;font-size:12px;color:var(--gold);padding:var(--s1) var(--s2) var(--s1) var(--s3);border-radius:999px;background:rgba(212,176,106,.1);transition:background .3s}
.row:hover .more{background:rgba(212,176,106,.2)}
.chev{flex:none;width:16px;height:16px;color:var(--gold)}
html[dir="rtl"] .chev{transform:scaleX(-1)}
.flag{display:inline-flex;flex-direction:column;width:16px;height:11px;border-radius:2px;overflow:hidden;margin-inline-start:6px;vertical-align:1px}
.flag i{flex:1}.flag i:nth-child(1){background:#c0303a}.flag i:nth-child(2){background:#fff}.flag i:nth-child(3){background:#2b4c8c}

/* ---------- gilded cards (sauces + add-ons): a gold light runs around each frame ---------- */
.cards{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--s3) var(--s2)}
.card{--w:calc((100% - 2 * var(--s2)) / 3);position:relative;flex:0 0 var(--w);max-width:var(--w);padding:1.5px;border-radius:18px;overflow:hidden;isolation:isolate;text-align:center;
  background:linear-gradient(160deg,rgba(240,220,170,.42),rgba(212,176,106,.07) 45%,rgba(212,176,106,.26));transition:transform .45s var(--spring)}
.card::before,.zm-card::before{content:"";position:absolute;z-index:-1;left:50%;top:50%;width:260%;aspect-ratio:1;transform:translate(-50%,-50%);
  background:conic-gradient(transparent 0 70%,rgba(240,220,170,.15) 76%,#f0dcaa 84%,#fffaf0 86%,#d4b06a 89%,transparent 93%);
  animation:orbit 6s linear infinite;animation-delay:calc(var(--i,0) * -1.1s);animation-play-state:paused}
.cards.live .card::before,.zm-card::before{animation-play-state:running}
@keyframes orbit{to{transform:translate(-50%,-50%) rotate(360deg)}}
.card-in{display:flex;flex-direction:column;align-items:center;height:100%;border-radius:16.5px;padding:var(--s2) var(--s1) var(--s3);
  background:radial-gradient(ellipse 85% 55% at 50% 36%,rgba(212,176,106,.17),transparent 70%),linear-gradient(180deg,#1b1813,#0e0d0a)}
.card .art{position:relative;display:block;width:100%;aspect-ratio:1;transition:transform .5s var(--smooth)}
.card .art svg,.card .art .pic{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.card .art .pic{object-fit:cover;border-radius:12px}
.card .cup{position:absolute;width:54%;inset-inline-end:-3%;bottom:-2%;filter:drop-shadow(0 6px 8px rgba(0,0,0,.6))}
.card .nm{display:block;font-size:13px;font-weight:600;line-height:1.35;margin-top:var(--s1)}
.card .pr{display:block;font-size:12px;color:var(--gold);line-height:1.6}
.card .pr .cur{font-size:.85em}
.card:hover .art{transform:translateY(-3px) scale(1.03)}
.card:active{transform:scale(.95)}
/* big view: the card grows into it */
.open-zm .veil{opacity:1;pointer-events:auto}
.zm{position:fixed;inset:0;z-index:42;display:grid;place-items:center;padding:var(--s4);pointer-events:none;visibility:hidden}
.zm-on .zm{visibility:visible}
.zm-card{position:relative;width:min(380px,100%);max-height:calc(100vh - 32px);overflow:hidden;border-radius:26px;padding:2px;isolation:isolate;pointer-events:auto;
  background:rgba(212,176,106,.28);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(212,176,106,.12)}
.zm-card::before{animation-duration:4.5s}
.zm-in{position:relative;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,#14120e,#0c0b09)}
.zm-x{top:var(--s3);inset-inline-end:var(--s3);z-index:3}
.zm-stage{position:relative;height:270px;overflow:hidden;cursor:pointer;background-image:radial-gradient(ellipse 60% 55% at 50% 62%,rgba(212,176,106,.3),transparent 70%),radial-gradient(rgba(240,220,170,.10) 1.2px,transparent 1.3px);background-size:auto,16px 16px}
.zm-txt{padding:var(--s4) var(--s5) var(--s5);text-align:center}
.zm-kick{font-size:12px;color:var(--gold);letter-spacing:.04em}
.zm-txt h2{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1.35;background:linear-gradient(180deg,#fbeec8,#d4b06a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(212,176,106,.4))}
.zm-txt p{font-size:14px;color:var(--muted);margin-top:var(--s1)}
.zm-price{display:inline-block;margin-top:var(--s4);padding:var(--s1) var(--s5);border-radius:999px;border:1px solid rgba(212,176,106,.45);background:rgba(212,176,106,.1);font-size:18px;font-weight:600;color:var(--gold-hi);box-shadow:inset 0 0 14px rgba(212,176,106,.15)}
.zm-on .zm-txt>*{animation:zmUp .55s var(--smooth) both;animation-delay:calc(.22s + var(--k) * 70ms)}
@keyframes zmUp{from{opacity:0;transform:translateY(12px)}}
/* sauce: a fry drops in, dips, comes out coated, drips */
.dipper{position:absolute;inset:0}
.dcup{position:absolute;inset-inline:0;bottom:6px;width:180px;margin-inline:auto;filter:drop-shadow(0 14px 18px rgba(0,0,0,.6))}
.dclip{position:absolute;inset-inline:0;top:-40px;height:156px;overflow:hidden;pointer-events:none}
.dfry{position:absolute;top:28px;inset-inline:0;margin-inline:auto;width:21px;height:96px;transform-origin:50% 100%;transform:rotate(-10deg);
  animation:dipIn 1.9s var(--smooth) both,bob 3.2s 2s ease-in-out infinite}
.dfry svg{display:block;width:100%;height:100%;overflow:visible}
@keyframes dipIn{0%{transform:translateY(-190px) rotate(-10deg)}38%{transform:translateY(56px) rotate(0)}54%{transform:translateY(60px) rotate(3deg)}80%{transform:translateY(-8px) rotate(-11deg)}100%{transform:rotate(-10deg)}}
@keyframes bob{0%,100%{transform:rotate(-10deg)}50%{transform:translateY(-5px) rotate(-8deg)}}
.dfry .ct{animation:coat 1.9s both}
@keyframes coat{0%,40%{opacity:0}44%,100%{opacity:1}}
.rip{position:absolute;top:104px;inset-inline:0;margin-inline:auto;width:76px;height:18px;border-radius:50%;border:2px solid var(--c);opacity:0;animation:rip .9s .68s var(--smooth)}
@keyframes rip{from{opacity:.9;transform:scale(.3)}to{opacity:0;transform:scale(1.5)}}
.drip{position:absolute;top:82px;inset-inline:0;margin-inline:auto;width:7px;height:10px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--c);box-shadow:0 0 0 .8px rgba(0,0,0,.15);opacity:0;animation:drip 2.6s 2.1s ease-in infinite}
@keyframes drip{0%{opacity:0;transform:scale(.2)}18%{opacity:1;transform:scale(1)}36%{opacity:1;transform:translateY(22px) scaleY(1.25)}42%,100%{opacity:0;transform:translateY(25px)}}
/* add-on: pieces fall on the fries, then the camera moves in close */
.kb{display:block;width:100%;height:100%;transform-origin:50% 30%;animation:kb 7s 1.1s var(--smooth) both}
.kb svg{width:100%;height:100%}
img.kb{object-fit:cover}
@keyframes kb{to{transform:scale(1.22)}}
.fall{animation:fall .75s var(--spring) both;animation-delay:var(--d)}
@keyframes fall{from{transform:translateY(-130px) rotate(-50deg);opacity:0}}
.float{position:fixed;z-index:60;pointer-events:none;font-size:13px;font-weight:600;color:var(--bg);background:var(--gold-hi);border-radius:999px;padding:0 var(--s2);line-height:22px;white-space:nowrap}

/* ---------- drinks fridge (cold theme) ---------- */
.fridge{position:relative;border-radius:30px;background:linear-gradient(180deg,#181611,#0d0c0a);padding:12px;border:1px solid rgba(212,176,106,.25)}
.fr-top{display:flex;align-items:center;justify-content:space-between;padding:2px var(--s2) 10px}
.temp{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#bfe6ff;background:rgba(120,190,255,.10);border:1px solid rgba(160,215,255,.25);border-radius:999px;padding:0 var(--s3);line-height:26px;font-variant-numeric:tabular-nums}
.temp svg{width:14px;height:14px}
.ptag{position:relative;display:inline-flex;align-items:baseline;gap:4px;background:linear-gradient(180deg,#f3dfae,#d4b06a);color:var(--bg);border-radius:10px 999px 999px 10px;padding:2px var(--s4) 2px var(--s3);padding-inline-start:22px;transform:rotate(-3deg);box-shadow:0 6px 12px -6px rgba(0,0,0,.6)}
html[dir="rtl"] .ptag{border-radius:999px 10px 10px 999px;transform:rotate(3deg)}
.ptag::before{content:"";position:absolute;inset-inline-start:8px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:#181611}
.ptag b{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.1}
.ptag small{font-size:12px;font-weight:600}
.ptag em{font-style:normal;font-size:11px;opacity:.75}
.glass{position:relative;border-radius:22px;overflow:hidden;padding:var(--s7) var(--s2) 0;
  background:linear-gradient(180deg,#5d8fd6 0%,#2e59a6 45%,#1d3b7a 100%)}
.glass::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
  background:linear-gradient(110deg,rgba(255,255,255,.14) 0 14%,transparent 14% 36%,rgba(255,255,255,.07) 36% 41%,transparent 41%)}
.frost{position:absolute;inset:0;pointer-events:none;z-index:3;
  background:radial-gradient(120px 90px at 0 0,rgba(255,255,255,.55),transparent 70%),radial-gradient(110px 80px at 100% 0,rgba(255,255,255,.45),transparent 70%),
  radial-gradient(140px 70px at 0 100%,rgba(255,255,255,.35),transparent 70%),radial-gradient(140px 70px at 100% 100%,rgba(255,255,255,.35),transparent 70%)}
.lightbar{position:absolute;top:12px;left:18%;right:18%;height:5px;border-radius:5px;background:#eaf6ff;z-index:2}
.lightwash{position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(180deg,rgba(220,240,255,.35),transparent);z-index:0;pointer-events:none}
.flake{position:absolute;top:-10px;z-index:1;width:var(--z);height:var(--z);border-radius:50%;background:#fff;opacity:.75;pointer-events:none;animation:snow var(--t) linear infinite;animation-delay:var(--dl)}
@keyframes snow{to{transform:translate(var(--dx),330px)}}
.mist{position:absolute;left:-20%;right:-20%;bottom:0;height:70px;z-index:2;pointer-events:none;
  background:radial-gradient(50% 60% at 30% 100%,rgba(255,255,255,.35),transparent 70%),radial-gradient(45% 55% at 75% 100%,rgba(255,255,255,.3),transparent 70%);
  animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(8%)}}
.shelf{position:relative;z-index:2;display:flex;justify-content:space-around;align-items:flex-end;padding-bottom:10px}
.shelf::after{content:"";position:absolute;left:-10px;right:-10px;bottom:0;height:10px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.12));border-top:1px solid rgba(255,255,255,.7)}
.ice{position:absolute;bottom:10px;z-index:1;width:16px;height:14px;border-radius:4px;background:linear-gradient(135deg,rgba(255,255,255,.85),rgba(190,230,255,.45));border:1px solid rgba(255,255,255,.8)}
.can{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:62px;animation:sway 3.4s ease-in-out infinite;animation-delay:calc(var(--i) * -.7s)}
@keyframes sway{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-5px) rotate(-1.5deg)}65%{transform:translateY(-2px) rotate(1.2deg)}}
.can svg{width:52px;height:104px;overflow:visible;transition:transform .55s var(--spring)}
.can .tab{transform-box:fill-box;transform-origin:50% 100%;transition:transform .3s var(--smooth)}
.can:hover svg{transform:translateY(-6px)}
.can.open svg{transform:translateY(-18px) rotate(-5deg)}
.can.open .tab{transform:rotate(-75deg)}
.puff{position:absolute;top:-6px;left:50%;width:40px;height:40px;margin-left:-20px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.8),rgba(255,255,255,0) 70%);animation:puff 1.1s var(--smooth) forwards}
@keyframes puff{from{transform:scale(.3);opacity:1}to{transform:translateY(-40px) scale(2.4);opacity:0}}
.labels{display:flex;justify-content:space-around;padding:var(--s3) 10px var(--s1)}
.labels span{width:62px;text-align:center;font-size:12px;line-height:1.4;color:#d8eeff}
.bub{position:absolute;top:0;left:50%;width:7px;height:7px;margin-left:-3px;border-radius:50%;border:1.5px solid rgba(255,255,255,.85);pointer-events:none;animation:up 1.1s var(--smooth) forwards}
@keyframes up{from{opacity:1}to{transform:translate(var(--x),-80px) scale(.3);opacity:0}}

footer{text-align:center;color:var(--muted);font-size:13px;padding:var(--s8) var(--s4) var(--s7)}
footer .ig{display:inline-flex;align-items:center;gap:var(--s2);color:var(--gold-hi);text-decoration:none;margin-top:var(--s3);background:var(--surface);border-radius:999px;padding:var(--s2) var(--s4);min-height:44px}
footer .ig svg{width:18px;height:18px}

/* ---------- detail sheet ---------- */
.veil{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .4s var(--smooth)}
.sheet{position:fixed;z-index:41;inset-inline:0;bottom:0;max-height:94vh;overflow:auto;background:var(--surface);border-radius:28px 28px 0 0;visibility:hidden;
  transform:translateY(105%);transition:transform .55s var(--smooth),visibility 0s .55s;padding-bottom:max(var(--s6),env(safe-area-inset-bottom))}
.open-sheet .veil{opacity:1;pointer-events:auto}
.open-sheet .sheet{transform:none;visibility:visible;transition:transform .55s var(--smooth)}
.sh-top{position:relative;background:#0a0908;padding:var(--s6) var(--s4) var(--s5);
  background-image:radial-gradient(rgba(240,220,170,.10) 1.2px,transparent 1.3px);background-size:16px 16px}
.grab{position:absolute;top:10px;left:50%;width:44px;height:5px;margin-left:-22px;border-radius:5px;background:rgba(255,255,255,.25)}
.sh-art{width:min(260px,66vw);aspect-ratio:1;margin:0 auto;border-radius:28px;overflow:hidden;box-shadow:0 24px 40px -18px rgba(0,0,0,.7);transition:transform .45s var(--smooth),opacity .3s}
.sh-art.photo{width:min(400px,92vw);aspect-ratio:4/3;border-radius:0;box-shadow:none;
  -webkit-mask-image:radial-gradient(ellipse 72% 70% at 50% 50%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 72% 70% at 50% 50%,#000 62%,transparent 100%)}
.sh-art svg,.sh-art img{width:100%;height:100%;display:block;object-fit:cover}
.sh-art.zoom{animation:zoomIn .6s var(--spring) both}
@keyframes zoomIn{from{transform:scale(.45) translateY(30px);opacity:0}}
.sh-art.out-l{transform:translateX(-40px) rotate(-4deg);opacity:0}
.sh-art.out-r{transform:translateX(40px) rotate(4deg);opacity:0}
.ib{position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(12,11,9,.65);display:grid;place-items:center;z-index:2}
.ib svg{width:18px;height:18px}
.sh-close{top:var(--s3);inset-inline-end:var(--s3)}
.nav-b{top:50%;margin-top:-20px}
.nav-prev{inset-inline-start:var(--s3)}
.nav-next{inset-inline-end:var(--s3)}
html[dir="rtl"] .nav-b svg{transform:scaleX(-1)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:var(--s4)}
.dots i{width:6px;height:6px;border-radius:6px;background:rgba(255,255,255,.25);transition:width .35s var(--smooth),background .35s}
.dots i.on{width:20px;background:var(--gold)}
.sh-body{padding:var(--s5) var(--s5) 0;max-width:520px;margin-inline:auto;text-align:center}
.sh-kick{font-size:12px;color:var(--gold)}
.sh-body h2{font-family:var(--f-display);font-weight:400;font-size:36px;line-height:1.35}
.sh-desc{position:relative;margin-top:var(--s3);padding:var(--s4) var(--s4);border-radius:18px;background:var(--surface-2);font-size:15px;line-height:1.9;color:var(--cream)}
.sh-desc::before{content:"";position:absolute;top:-6px;left:50%;width:12px;height:12px;margin-left:-6px;background:var(--surface-2);transform:rotate(45deg);border-radius:2px}
.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s3)}
.chips > span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--gold-hi);border:1px solid var(--line);border-radius:999px;padding:2px var(--s3)}
.chips svg{width:12px;height:14px}
.seg{position:relative;display:inline-flex;margin-top:var(--s4);padding:4px;border-radius:999px;background:var(--bg)}
.seg button{position:relative;z-index:1;display:flex;align-items:baseline;gap:6px;padding:var(--s2) var(--s4);border-radius:999px;color:var(--muted);transition:color .35s var(--smooth)}
.seg button .price{font-family:var(--f-display);font-size:24px;line-height:1.2}
.seg button.on{color:var(--bg)}
.seg button.on .cur{color:var(--bg)}
.seg .knob{position:absolute;z-index:0;top:4px;bottom:4px;left:0;border-radius:999px;background:var(--gold);transition:transform .45s var(--smooth),width .45s var(--smooth)}
.one{display:inline-block;margin-top:var(--s4);padding:var(--s1) var(--s5);border-radius:999px;background:var(--gold);color:var(--bg)}
.one .price{font-family:var(--f-display);font-size:28px}
.one .cur{color:var(--bg)}

/* food motion (switch: FOOD_MOTION in the script) */
.food-motion .thumb.ph img{animation:breathe 7s ease-in-out infinite;animation-delay:calc(var(--n,0) * -1.3s)}
@keyframes breathe{50%{transform:scale(1.07) translateY(-2px)}}
.steam{position:absolute;left:50%;top:var(--s6);width:160px;height:150px;margin-left:-80px;pointer-events:none;z-index:1;display:none}
.food-motion .sh-top.has-photo .steam{display:block}
.steam i{position:absolute;bottom:0;width:18px;height:70px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,255,255,.55),transparent 70%);filter:blur(7px);opacity:0;animation:steam 3.6s ease-in infinite}
.steam i:nth-child(1){left:38%;animation-delay:0s}.steam i:nth-child(2){left:52%;animation-delay:1.2s}.steam i:nth-child(3){left:45%;animation-delay:2.4s}
@keyframes steam{0%{transform:translateY(20px) scaleX(.6);opacity:0}30%{opacity:.8}100%{transform:translateY(-90px) translateX(10px) scaleX(1.6);opacity:0}}
.food-motion .sh-art.photo img{animation:floaty 5s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-5px) scale(1.02)}}

/* drawing animations */
.drz{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s var(--smooth) forwards;animation-delay:.25s}
@keyframes draw{to{stroke-dashoffset:0}}
.pour{transform-box:fill-box;transform-origin:center;animation:pour .8s var(--spring) both;animation-delay:.25s}
@keyframes pour{from{transform:scale(.1);opacity:0}}
.drop{animation:drop .6s var(--spring) both;animation-delay:var(--d)}
@keyframes drop{from{transform:translateY(-70px);opacity:0}}
.spark{position:fixed;z-index:60;width:8px;height:8px;pointer-events:none;background:var(--c,var(--gold-hi));border-radius:50% 50% 50% 0}


.bar .nm{font-family:"Oswald",sans-serif;font-weight:600;font-size:19px;letter-spacing:.12em;direction:ltr;unicode-bidi:isolate;text-align:left}
html[dir="rtl"] .bar .nm{text-align:right}
.ribbon h1{font-family:"Oswald",sans-serif;font-weight:600;font-size:clamp(30px,8.5vw,42px);letter-spacing:.14em;line-height:1.3;padding-inline:calc(var(--s7) + 4px) calc(var(--s7) - 4px)}
/* animated wordmark: FUNCR + windmill + ZER, like their logo */
.ribbon{cursor:pointer}
.wordmark{position:relative;display:flex;align-items:center;justify-content:center;direction:ltr;overflow:hidden}
.wordmark .lt{display:inline-block;animation:ltIn .7s var(--spring) both;animation-delay:calc(var(--i) * 70ms + .5s)}
.wordmark .mill{display:inline-block;width:.92em;height:1.05em;margin:0 .04em;transform:translateY(-.04em);color:var(--bg);animation:ltIn .7s var(--spring) both;animation-delay:.85s}
.wordmark .mill svg{width:100%;height:100%;overflow:visible;display:block}
.wordmark .sails{transform-origin:20px 20px;animation:spin 6s linear infinite}
.ribbon.wave .lt{animation:wave .6s var(--spring);animation-delay:calc(var(--i) * 45ms)}
.ribbon.wave .sails{animation-duration:.6s}
@keyframes ltIn{from{transform:translateY(70%) scale(.6);opacity:0}}
@keyframes wave{40%{transform:translateY(-22%)}}
.wordmark::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;pointer-events:none;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.65),transparent);animation:shine 4.5s ease-in-out infinite;animation-delay:1.8s}
@keyframes shine{0%{left:-60%}35%,100%{left:130%}}
/* soft glow on all other text (light, not overdone) */
body{text-shadow:0 0 9px rgba(240,220,170,.2)}

.bar .nm{text-shadow:0 0 12px rgba(240,220,170,.45)}
.disc{background:radial-gradient(circle at 50% 45%,rgba(212,176,106,.30),rgba(212,176,106,.08) 55%,#171510 75%);
  box-shadow:0 0 0 1.5px rgba(212,176,106,.55),0 0 50px rgba(212,176,106,.35),0 0 120px rgba(212,176,106,.18)}
.ring{border-color:rgba(240,220,170,.75)}
.stagewrap::before{content:"";position:absolute;inset:-60px;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(240,220,170,.14) 0 5deg,transparent 5deg 15deg);
  -webkit-mask:radial-gradient(circle,#000 35%,transparent 70%);mask:radial-gradient(circle,#000 35%,transparent 70%);animation:spin 60s linear infinite}
.cone svg{filter:drop-shadow(0 0 10px rgba(247,197,72,.45))}
.ribbon{filter:drop-shadow(0 0 14px rgba(212,176,106,.55))}
.head h2{text-shadow:0 0 16px rgba(240,220,170,.35)}
.row{box-shadow:inset 0 0 0 1px rgba(212,176,106,.16)}
.info b{color:var(--gold-hi);text-shadow:0 0 10px rgba(240,220,170,.35)}
.thumb.ph{box-shadow:0 0 0 1.5px rgba(212,176,106,.6),0 0 18px rgba(212,176,106,.3)}
.sh-top{background-image:radial-gradient(ellipse 55% 60% at 50% 48%,rgba(212,176,106,.28),transparent 70%),radial-gradient(rgba(240,220,170,.10) 1.2px,transparent 1.3px);background-size:auto,16px 16px}
.sh-body h2{background:linear-gradient(180deg,#fbeec8,#d4b06a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(212,176,106,.4))}

}

}

  water:   () => `<svg viewBox="0 0 52 104" aria-hidden="true"><ellipse cx="26" cy="99" rx="16" ry="3.5" fill="#000" opacity=".35"/><rect class="tab" x="19" y="2" width="14" height="8" rx="2.5" fill="#2b7fc0"/>
    <path d="M19 10h14v7q10 6 10 18v53q0 8-8 8H17q-8 0-8-8V35q0-12 10-18z" fill="#cfeaf8" fill-opacity=".55" stroke="#eaf6fd" stroke-width="1.5"/>
    <path d="M9 52h34v20H9z" fill="#2b7fc0"/><path d="M14 56q6 4 12 0t12 0" stroke="#fff" stroke-width="1.5" fill="none" opacity=".85"/>
    <path d="M14 28v58" stroke="#fff" stroke-opacity=".7" stroke-width="2.5" stroke-linecap="round"/></svg>`
};

/* ---------- render ---------- */
const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
function rowHTML(it, idx) {
  const thumb = PHOTOS.includes(it.k) ? `<img src="images/dishes/${it.k}.webp" alt="" loading="lazy">` : trayArt(it.art, hash(it.k), false);
  const tags = [TG(it)].filter(Boolean).map(t => `<span class="tg">${t}</span>`).join("");
  const szl = `<div class="szl">${(it.sizes || [["", "", it.p]]).map(z => `<span>${z[0] ? `<small>${lang === "ar" ? z[0] : z[1]}</small>` : ""}${money(z[2])}</span>`).join("")}</div>`;
  const off = OFF.has(it.k);
  return `<button class="row${off ? " off" : ""}" type="button" data-x="${idx}"${off ? ' aria-disabled="true"' : ""}><div class="thumb${PHOTOS.includes(it.k) ? " ph" : ""}" style="--n:${idx}">${thumb}</div>
    <div class="info"><b>${N(it)}${it.flag ? FLAG : ""}</b>${tags ? `<div class="tagline">${tags}</div>` : ""}${szl}</div>
    ${off ? `<span class="so">${L(TXT.off)}</span>` : `<span class="more">${L(TXT.more)}${CHEV}</span>`}</button>`;
}

let cio;
const cardHTML = (o, i, t) => {
  const art = t === "s" ? friesBoat(hash(o.k), null, 0) + `<img class="cup" src="images/sauces/${o.k}.webp" alt="" loading="lazy">`
    : ADDON_IMG.includes(o.k) ? `<img class="pic" src="images/addons/${o.k}.webp" alt="" loading="lazy">` : friesBoat(hash(o.k), o.k, 0);
  const off = OFF.has(o.k);
  return `<button class="card${off ? " off" : ""}" type="button" data-t="${t}" data-k="${i}" style="--i:${i}"${off ? ' aria-disabled="true"' : ""}><span class="card-in">${off ? `<span class="so">${L(TXT.off)}</span>` : ""}<span class="art">${art}</span><span class="nm">${N(o)}</span><span class="pr">${o.p ? money(o.p) : L(TXT.free)}</span></span></button>`;
};

function render() {
  const h = document.documentElement; h.lang = lang; h.dir = lang === "ar" ? "rtl" : "ltr";
  $("lang").textContent = lang === "ar" ? "English" : "عربي";
  document.querySelectorAll("[data-i]").forEach(el => el.textContent = L(TXT[el.dataset.i]));
  $("shClose").setAttribute("aria-label", L(TXT.close)); $("shPrev").setAttribute("aria-label", L(TXT.prev)); $("shNext").setAttribute("aria-label", L(TXT.next));
  const nav = [...SECTIONS.map(s => [s.id, N(s)]), ["drinks", L(TXT.drinksTab)], ["sauces", L(TXT.sauces)], ["addons", L(TXT.addons)]];
  $("tabs").innerHTML = '<li class="pill" id="pill" aria-hidden="true"></li>' + nav.map(([id, n]) => `<li><a href="#${id}">${n}</a></li>`).join("");
  let idx = 0; const dUni = new Set(DRINKS.map(d => d.p)).size === 1 && DRINKS[0].p > 0;
  $("menu").innerHTML =
    SECTIONS.map(s => `<section id="${s.id}"><div class="head"><h2>${N(s)}</h2>${s.hint ? `<p>${L(TXT.tapHint)}</p>` : ""}</div>
      <div class="list">${s.items.map(it => rowHTML(it, idx++)).join("")}</div></section>`).join("") +
    `<section id="drinks"><div class="head"><h2>${L(TXT.drinks)}</h2><p>${L(TXT.drinkP)}</p></div>
      <div class="fridge"><div class="fr-top" aria-hidden="true"><span class="temp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M4 7l16 10M20 7L4 17M9 3l3 3 3-3M9 21l3-3 3 3"/></svg><span dir="ltr">4°C</span></span>${dUni ? `<span class="ptag"><b class="price">${fmt(DRINKS[0].p)}</b><small>${L(TXT.cur)}</small><em>${L(TXT.each)}</em></span>` : ""}</div>
        <div class="glass"><div class="lightwash" aria-hidden="true"></div><div class="lightbar" aria-hidden="true"></div><div id="snow" aria-hidden="true"></div><div class="mist" aria-hidden="true"></div><div class="frost" aria-hidden="true"></div>
        <span class="ice" style="inset-inline-start:6%" aria-hidden="true"></span><span class="ice" style="inset-inline-end:7%;transform:rotate(14deg)" aria-hidden="true"></span>
        <div class="shelf">${DRINKS.map((d, i) => `<button class="can${OFF.has(d.k) ? " off" : ""}" style="--i:${i}" type="button" data-p="${d.p ? fmt(d.p) : L(TXT.free)}" aria-label="${N(d)}${OFF.has(d.k) ? " · " + L(TXT.off) : ""}">${CANS[d.k](i)}</button>`).join("")}</div></div>
        <div class="labels" aria-hidden="true">${DRINKS.map(d => `<span>${N(d)}${OFF.has(d.k) ? `<em class="so">${L(TXT.off)}</em>` : dUni ? "" : `<small>${d.p ? fmt(d.p) : L(TXT.free)}</small>`}</span>`).join("")}</div></div></section>
     <section id="sauces"><div class="head"><h2>${L(TXT.sauces)}</h2><p>${L(TXT.sauceP)}</p></div>
      <div class="cards">${SAUCES.map((o, i) => cardHTML(o, i, "s")).join("")}</div></section>
     <section id="addons"><div class="head"><h2>${L(TXT.addons)}</h2><p>${L(TXT.addP)}</p></div>
      <div class="cards">${ADDONS.map((o, i) => cardHTML(o, i, "a")).join("")}</div></section>`;
  if (cio) cio.disconnect();
  cio = new IntersectionObserver(es => es.forEach(e => e.target.classList.toggle("live", e.isIntersecting)), {rootMargin: "80px"});
  document.querySelectorAll(".cards").forEach(c => cio.observe(c));
  const sn = $("snow"); if (sn && !RM) { const r = rng(5); let f = "";
    for (let i = 0; i < 22; i++) f += `<i class="flake" style="left:${(r() * 100).toFixed(1)}%;--z:${(2 + r() * 3).toFixed(1)}px;--t:${(6 + r() * 6).toFixed(1)}s;--dl:-${(r() * 10).toFixed(1)}s;--dx:${(r() * 30 - 15).toFixed(0)}px"></i>`;
    sn.innerHTML = f; }
  watch(nav.map(n => n[0]));
}

/* ---------- hero cone ---------- */
(() => { const r = rng(9); let s = "";
  for (let i = 0; i < 11; i++) { const x = 38 + i * 8.4, top = 6 + Math.abs(i - 5) * 6 + r() * 10, a = ((i - 5) * 3.2).toFixed(1);
    s += `<g transform="rotate(${a} ${x.toFixed(1)} 90)"><rect class="fry" style="--i:${i}" x="${(x - 4.5).toFixed(1)}" y="${top.toFixed(1)}" width="9" height="${(96 - top).toFixed(1)}" rx="2.5" fill="${i % 2 ? "#f7c548" : "#eeb43c"}" stroke="#c9892a" stroke-width=".8"/></g>`; }
  $("coneFries").innerHTML = s; })();

/* ---------- detail sheet (swipe or arrows to browse dishes) ---------- */
let cur = 0, lastRow = null, size = 0;
function fillSheet(dir) {
  const {it, s} = ALL[cur], art = $("shArt");
  const put = () => {
    art.classList.toggle("photo", PHOTOS.includes(it.k)); $("shTop").classList.toggle("has-photo", PHOTOS.includes(it.k));
    art.innerHTML = PHOTOS.includes(it.k) ? `<img src="images/dishes/${it.k}.webp" alt="">` : trayArt(it.art, hash(it.k), !RM);
    $("shKick").textContent = N(s);
    $("shName").innerHTML = N(it) + (it.flag ? FLAG : "");
    $("shDesc").textContent = D(it);
    const chips = [];
    if (it.sauce) chips.push(`<span><svg viewBox="0 0 12 14"><path d="M6 1C6 1 1.5 7 1.5 9.5a4.5 4.5 0 0 0 9 0C10.5 7 6 1 6 1z" fill="#f0dcaa"/></svg>${L(TXT.withSauce)}</span>`);
    if (TG(it)) chips.push(`<span>${TG(it)}</span>`);
    $("shChips").innerHTML = chips.join("");
    size = 0;
    $("shPrice").innerHTML = OFF.has(it.k) ? `<div class="so big">${L(TXT.off)}</div>` : it.sizes
      ? `<div class="seg" role="group"><span class="knob" id="knob"></span>${it.sizes.map((z, j) => `<button type="button" data-z="${j}" class="${j ? "" : "on"}" aria-pressed="${!j}"><small>${lang === "ar" ? z[0] : z[1]}</small>${money(z[2])}</button>`).join("")}</div>`
      : `<div class="one">${money(it.p)}</div>`;
    moveKnob();
    $("shDots").innerHTML = ALL.map((_, j) => `<i class="${j === cur ? "on" : ""}"></i>`).join("");
    art.classList.remove("out-l", "out-r");
  };
  if (dir && !RM) { art.classList.add(dir > 0 ? "out-l" : "out-r"); setTimeout(put, 220); } else put();
}
function moveKnob() {
  const k = $("knob"); if (!k) return; const b = k.parentNode.querySelectorAll("button")[size];
  k.style.width = b.offsetWidth + "px"; k.style.transform = `translateX(${b.offsetLeft}px)`;
}
function openSheet(i, row) {
  cur = i; lastRow = row; fillSheet(0); if (!RM) replay($("shArt"), "zoom");
  document.body.classList.add("open-sheet"); document.body.style.overflow = "hidden";
  $("sheet").scrollTop = 0; requestAnimationFrame(moveKnob);
  setTimeout(() => { moveKnob(); $("shClose").focus({preventScroll: true}); }, 80);
}
function closeSheet() {
  if (!document.body.classList.contains("open-sheet")) return;
  document.body.classList.remove("open-sheet"); document.body.style.overflow = ""; $("sheet").style.transform = "";
  if (lastRow) lastRow.focus({preventScroll: true});
}
const step = d => { cur = (cur + d + ALL.length) % ALL.length; fillSheet(d); };
$("veil").addEventListener("click", closeSheet);
$("shClose").addEventListener("click", closeSheet);
$("shNext").addEventListener("click", () => step(1));
$("shPrev").addEventListener("click", () => step(-1));
$("shPrice").addEventListener("click", e => { const b = e.target.closest("[data-z]"); if (!b) return; size = +b.dataset.z;
  b.parentNode.querySelectorAll("button").forEach((x, j) => { x.classList.toggle("on", j === size); x.setAttribute("aria-pressed", j === size); }); moveKnob(); });
addEventListener("keydown", e => { if (!document.body.classList.contains("open-sheet")) return;
  if (e.key === "Escape") closeSheet();
  if (e.key === "ArrowLeft") step(lang === "ar" ? 1 : -1);
  if (e.key === "ArrowRight") step(lang === "ar" ? -1 : 1); });
(() => { let x0 = null, y0 = null, dy = 0, dx = 0; const sh = $("sheet");
  sh.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = dy = 0; }, {passive: true});
  sh.addEventListener("touchmove", e => { if (y0 === null) return; dx = e.touches[0].clientX - x0; dy = e.touches[0].clientY - y0;
    if (Math.abs(dy) > Math.abs(dx) && dy > 0 && sh.scrollTop <= 0 && innerWidth < 860) { sh.style.transition = "none"; sh.style.transform = `translateY(${dy}px)`; } }, {passive: true});
  sh.addEventListener("touchend", () => { if (y0 === null) return; sh.style.transition = "";
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) { const fwd = dx < 0; step((lang === "ar" ? !fwd : fwd) ? 1 : -1); sh.style.transform = ""; }
    else if (dy > 110 && Math.abs(dy) > Math.abs(dx) && innerWidth < 860) closeSheet(); else sh.style.transform = "";
    x0 = y0 = null; });
})();

/* ---------- taps ---------- */
function splash(x, y, color, n = 8) {
  if (RM) return;
  for (let i = 0; i < n; i++) {
    const s = document.createElement("span"); s.className = "spark"; s.style.left = x + "px"; s.style.top = y + "px"; s.style.setProperty("--c", color);
    const a = -Math.PI / 2 + (Math.random() - .5) * 2.4, d = 30 + Math.random() * 40, sc = .5 + Math.random() * .8;
    document.body.appendChild(s);
    s.animate([{transform:`translate(-50%,-50%) scale(${sc})`, opacity:1},
               {transform:`translate(calc(-50% + ${Math.cos(a) * d}px),calc(-50% + ${Math.sin(a) * d}px)) scale(${sc})`, opacity:1, offset:.5},
               {transform:`translate(calc(-50% + ${Math.cos(a) * d * 1.2}px),calc(-50% + ${Math.sin(a) * d + 50}px)) scale(.2)`, opacity:0}],
      {duration: 800 + Math.random() * 200, easing: "cubic-bezier(.22,1,.36,1)"}).onfinish = () => s.remove();
  }
}
function floatPrice(el, p) {
  if (RM) return;
  const r = el.getBoundingClientRect(), f = document.createElement("span"); f.className = "float";
  f.innerHTML = p === "free" ? L(TXT.free) : `+${fmt(+p)} ${L(TXT.cur)}`;
  f.style.left = (r.left + r.width / 2) + "px"; f.style.top = (r.top + 6) + "px"; document.body.appendChild(f);
  f.animate([{transform:"translate(-50%,0) scale(.6)", opacity:0},{transform:"translate(-50%,-22px) scale(1)", opacity:1, offset:.25},{transform:"translate(-50%,-46px)", opacity:0}],
    {duration: 1300, easing: "cubic-bezier(.22,1,.36,1)"}).onfinish = () => f.remove();
}
const replay = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };

document.addEventListener("click", e => {
  const row = e.target.closest(".row");
  if (row && row.classList.contains("off")) return;
  if (row) { openSheet(+row.dataset.x, row); return; }
  const cd = e.target.closest(".card");
  if (cd) { if (!cd.classList.contains("off")) openZoom(cd); return; }
  const can = e.target.closest(".can");
  if (can) { if (RM || can.classList.contains("off")) return; can.classList.add("open"); floatPrice(can, can.dataset.p);
    { const pf = document.createElement("span"); pf.className = "puff"; can.appendChild(pf); setTimeout(() => pf.remove(), 1200); }
    for (let i = 0; i < 10; i++) { const b = document.createElement("span"); b.className = "bub"; b.style.setProperty("--x", ((Math.random() - .5) * 46) + "px"); b.style.animationDelay = (i * .06) + "s"; can.appendChild(b); setTimeout(() => b.remove(), 1700); }
    clearTimeout(can._t); can._t = setTimeout(() => can.classList.remove("open"), 2200); return; }
  if (e.target.closest("#cone") && !RM) replay($("cone"), "jump");
  if (e.target.closest("#ribbon") && !RM) replay($("ribbon"), "wave");
});

/* ---------- big view: card grows into it ---------- */
let zmCard = null, zmItem = null;
function zoomStage() {
  const {o, t} = zmItem;
  if (t === "s") return SAUCE_DIP.includes(o.k) ? `<img class="kb" src="images/sauces/${o.k}-dip.webp" alt="">`
    : `<div class="dipper" style="--c:${o.c}"><span class="rip"></span><img class="dcup" src="images/sauces/${o.k}.webp" alt=""><div class="dclip"><div class="dfry">${frySVG(o.c)}</div></div><span class="drip"></span></div>`;
  return ADDON_IMG.includes(o.k) ? `<img class="kb" src="images/addons/${o.k}.webp" alt="">` : `<div class="kb">${friesBoat(hash(o.k) + 3, o.k, 1)}</div>`;
}
function playStage() {
  const st = $("zmStage"); st.innerHTML = zoomStage();
  if (zmItem.t === "s" && !SAUCE_DIP.includes(zmItem.o.k) && !RM)
    setTimeout(() => { const r = st.getBoundingClientRect(); if (document.body.classList.contains("open-zm")) splash(r.left + r.width / 2, r.top + 108, zmItem.o.c, 7); }, 740);
}
const flipTo = (z, c) => { const f = z.getBoundingClientRect(), r = c.getBoundingClientRect();
  return `translate(${(r.left + r.width / 2 - f.left - f.width / 2).toFixed(1)}px,${(r.top + r.height / 2 - f.top - f.height / 2).toFixed(1)}px) scale(${(r.width / f.width).toFixed(3)},${(r.height / f.height).toFixed(3)})`; };
function openZoom(card) {
  const t = card.dataset.t, o = (t === "s" ? SAUCES : ADDONS)[+card.dataset.k];
  zmCard = card; zmItem = {o, t};
  $("zmKick").textContent = L(t === "s" ? TXT.sauces : TXT.addons);
  $("zmName").textContent = N(o); $("zmDesc").textContent = D(o);
  $("zmPrice").innerHTML = o.p ? money(o.p) : L(TXT.free);
  $("zmX").setAttribute("aria-label", L(TXT.close));
  playStage();
  document.body.classList.add("zm-on", "open-zm"); document.body.style.overflow = "hidden";
  const z = $("zmCard"); z.getAnimations().forEach(a => a.cancel());
  if (!RM) z.animate([{transform: flipTo(z, card), borderRadius: "18px"}, {transform: "none", borderRadius: "26px"}], {duration: 560, easing: "cubic-bezier(.22,1,.36,1)"});
  setTimeout(() => $("zmX").focus({preventScroll: true}), 60);
}
function closeZoom() {
  if (!document.body.classList.contains("open-zm")) return;
  const z = $("zmCard"), c = zmCard;
  document.body.classList.remove("open-zm");
  const done = () => { document.body.classList.remove("zm-on"); document.body.style.overflow = ""; z.getAnimations().forEach(a => a.cancel()); $("zmStage").innerHTML = ""; if (c) c.focus({preventScroll: true}); };
  if (RM || !c) return done();
  z.animate([{transform: "none", opacity: 1}, {transform: flipTo(z, c), opacity: 0}], {duration: 380, easing: "cubic-bezier(.5,0,.75,0)", fill: "forwards"}).onfinish = done;
}
$("zmX").addEventListener("click", closeZoom);
$("veil").addEventListener("click", closeZoom);
$("zmStage").addEventListener("click", () => { if (!RM) playStage(); });
addEventListener("keydown", e => { if (e.key === "Escape") closeZoom(); });

$("lang").addEventListener("click", () => { closeSheet(); closeZoom(); lang = lang === "ar" ? "en" : "ar"; try { localStorage.setItem("fc-lang", lang); } catch(e) {} render(); });

/* ---------- tabs: sliding pill follows the section in view ---------- */
let io;
function movePill(a) {
  const p = $("pill"), ul = $("tabs"); if (!a || !p) return;
  p.style.width = a.offsetWidth + "px"; p.style.transform = `translateX(${a.offsetLeft}px)`; p.style.top = a.offsetTop + "px";
  const r = a.getBoundingClientRect(), u = ul.getBoundingClientRect();
  ul.scrollBy({left: (r.left + r.width / 2) - (u.left + u.width / 2), behavior: RM ? "auto" : "smooth"});
}
function watch(ids) {
  if (io) io.disconnect();
  const links = [...document.querySelectorAll(".tabs a")];
  const setOn = id => links.forEach(a => { const on = a.getAttribute("href") === "#" + id; a.classList.toggle("on", on); if (on) movePill(a); });
  setOn(ids[0]);
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) setOn(e.target.id); }), {rootMargin: "-40% 0px -55% 0px"});
  ids.forEach(id => io.observe($(id)));
}
addEventListener("resize", () => { movePill(document.querySelector(".tabs a.on")); moveKnob(); });

loadLive().then(() => {
  render();
  document.fonts && document.fonts.ready.then(() => movePill(document.querySelector(".tabs a.on")));
  if (RM) document.querySelectorAll("svg").forEach(s => s.pauseAnimations && s.pauseAnimations());
});
</script>
</body>
</html>
